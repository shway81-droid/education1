<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가계부</title>
<style>
:root{--bg:#f3f5f1;--card:#fff;--text:#1f2a24;--sub:#68756d;--line:#dfe5df;--main:#1f7a5a;--main-ink:#fff;--bad:#c0392b;--track:#e8eee9;--muted-bar:#9aa8a0}
@media (prefers-color-scheme:dark){:root{--bg:#121714;--card:#1b231e;--text:#eaf1ec;--sub:#9db0a5;--line:#2c3830;--main:#4cc79a;--main-ink:#0c1511;--bad:#ff7b6b;--track:#2a352e;--muted-bar:#5d6e64}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:18px/1.5 -apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:26px;margin:8px 0 12px}
section{background:var(--card);border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
h2{font-size:20px;margin:0 0 12px}
label.l{display:block;font-size:16px;color:var(--sub);margin:12px 0 6px}
input,select{width:100%;height:56px;font-size:20px;padding:0 14px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--main)}
select#month{font-weight:700;margin-bottom:16px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cats button{min-height:60px;font-size:19px;font-weight:700;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);cursor:pointer;font-family:inherit;overflow-wrap:anywhere}
.cats button[aria-pressed=true]{background:var(--main);border-color:var(--main);color:var(--main-ink)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:56px;font-size:18px;font-weight:700;border-radius:12px;cursor:pointer;font-family:inherit;border:2px solid var(--main);background:transparent;color:var(--main)}
.btn.gray{border-color:var(--line);color:var(--sub);font-weight:600}
.btn.sm{height:48px;font-size:16px}
.save{display:block;width:100%;height:64px;margin-top:16px;font-size:22px;font-weight:700;border:0;border-radius:14px;background:var(--main);color:var(--main-ink);cursor:pointer;font-family:inherit}
.msg{min-height:1.5em;margin:8px 0 0;font-size:16px}
.msg.err{color:var(--bad)}.msg.ok{color:var(--main)}
.hint{font-size:15px;color:var(--sub);margin:6px 0 0}
.warn{background:#fff3cd;color:#5c4400;border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:16px}
.total{font-size:40px;font-weight:800;margin:0;font-variant-numeric:tabular-nums}
.bars{display:grid;gap:12px;margin-top:14px}
.bar .top{display:flex;justify-content:space-between;font-size:17px;gap:8px}
.bar .top b{font-variant-numeric:tabular-nums;white-space:nowrap}
.bar .track{height:22px;background:var(--track);border-radius:999px;overflow:hidden;margin-top:4px}
.bar .fill{height:100%;background:var(--main);border-radius:999px;transition:width .3s}
.bar.gone .fill{background:var(--muted-bar)}
.pct,.gonetag{color:var(--sub);font-weight:400;font-size:15px}
.manage{margin-top:12px;padding:12px;border:2px dashed var(--line);border-radius:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{display:flex;align-items:center;background:var(--bg);border-radius:999px;padding:2px 2px 2px 16px;font-weight:600}
.chip button{width:44px;height:44px;border:0;background:none;color:var(--bad);font-size:22px;cursor:pointer}
.row{display:flex;gap:10px}
.row input{min-width:0}
.row button{flex:none;width:auto;padding:0 18px}
.status{font-size:16px;margin:8px 0 0}
.rec{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.rec .info{flex:1;min-width:0}
.rec .d{font-size:15px;color:var(--sub)}
.rec .c{display:inline-block;font-size:14px;font-weight:700;background:var(--track);border-radius:999px;padding:0 10px;margin-right:6px}
.rec .m{overflow-wrap:anywhere}
.rec .a{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.rec button{width:48px;height:48px;flex:none;border:0;background:none;color:var(--bad);font-size:24px;cursor:pointer}
.empty{color:var(--sub);margin:4px 0 0}
.export{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
</style>
</head>
<body>
<main>
<h1>📒 가계부</h1>
<div class="warn" id="warn" hidden>이 브라우저에서는 기록이 저장되지 않습니다. 창을 닫으면 지금 입력한 내용이 사라집니다. 비공개 창이 아닌지 확인해 주세요.</div>

<select id="month" aria-label="조회할 달"></select>

<section>
  <h2 id="sumtitle">이번 달 쓴 돈</h2>
  <p class="total" id="total">0원</p>
  <div class="bars" id="bars"></div>
</section>

<section>
  <h2>기록하기</h2>
  <label class="btn" for="rfile" style="margin-bottom:0">📷 영수증 사진으로 입력</label>
  <input id="rfile" type="file" accept="image/*" hidden>
  <div class="status" id="rstatus"></div>
  <p class="hint">영수증을 읽는 이 기능만 인터넷이 필요합니다. 처음에는 읽을 준비를 하느라 1분쯤 걸립니다. 사진은 밖으로 보내지 않고 이 기기 안에서만 처리합니다.</p>

  <label class="l" for="date">날짜</label>
  <input type="date" id="date">
  <label class="l">분류</label>
  <div class="cats" id="cats"></div>
  <button type="button" class="btn gray sm" id="manageBtn" style="margin-top:10px" aria-expanded="false">분류 관리 (추가·삭제)</button>
  <div class="manage" id="manage" hidden>
    <div class="chips" id="chips"></div>
    <div class="row">
      <input id="newcat" placeholder="새 분류 이름" maxlength="8" autocomplete="off">
      <button type="button" class="btn" id="addcat">추가</button>
    </div>
    <div class="msg" id="catmsg" role="status"></div>
  </div>
  <label class="l" for="amt">금액 (원)</label>
  <input id="amt" inputmode="numeric" placeholder="예: 12,000" autocomplete="off">
  <label class="l" for="memo">메모 (없어도 됩니다)</label>
  <input id="memo" placeholder="예: 마트 장보기" maxlength="40" autocomplete="off">
  <button class="save" id="save">저장</button>
  <div class="msg" id="msg" role="status"></div>
</section>

<section>
  <h2 id="listtitle">기록</h2>
  <div id="list"></div>
  <div class="export">
    <button type="button" class="btn" id="csvMonth">이 달 CSV 내보내기</button>
    <button type="button" class="btn" id="csvAll">전체 CSV 내보내기</button>
  </div>
  <p class="hint">엑셀에서 열 수 있는 CSV 파일이 내려받아집니다.</p>
</section>
</main>

<script>
// 기록과 분류는 이 파일이 아니라 이 브라우저 안에만 저장합니다. (저장 이름은 gagyebu-로 시작)
var KEY="gagyebu-records",CKEY="gagyebu-categories";
var DEFAULT_CATS=["식비","장보기","교통","생활","아이","기타"];
var records=[],cats=DEFAULT_CATS.slice(),canSave=true,cat="",viewYm="";

function $(id){return document.getElementById(id)}
function pad(n){return n<10?"0"+n:""+n}
function todayStr(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function won(n){return n.toLocaleString("ko-KR")+"원"}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function ymLabel(ym){return ym.slice(0,4)+"년 "+(+ym.slice(5))+"월"}

/* ---------- 저장 ---------- */
function load(){
  try{
    var r=JSON.parse(localStorage.getItem(KEY)||"[]");records=Array.isArray(r)?r:[];
    var c=JSON.parse(localStorage.getItem(CKEY)||"null");if(Array.isArray(c)&&c.length)cats=c;
  }catch(e){records=[];canSave=false}
}
function persist(){
  try{localStorage.setItem(KEY,JSON.stringify(records));localStorage.setItem(CKEY,JSON.stringify(cats));canSave=true}
  catch(e){canSave=false}
  $("warn").hidden=canSave;
}

/* ---------- 계산 (화면과 따로 시험할 수 있는 순수 함수) ---------- */
// 선택한 달의 합계와 분류별 합계. 지운 분류의 기록도 그대로 세고 gone 표시를 붙입니다.
function summarize(list,ym,catList){
  var by={},total=0,order=catList.slice();
  list.forEach(function(r){
    if(r.date.slice(0,7)!==ym)return;
    if(by[r.cat]===undefined){by[r.cat]=0;if(order.indexOf(r.cat)<0)order.push(r.cat)}
    by[r.cat]+=r.amount;total+=r.amount;
  });
  return{total:total,rows:order.map(function(c){return{name:c,value:by[c]||0,gone:catList.indexOf(c)<0}})};
}
function monthsOf(list,curYm){
  var set={};set[curYm]=1;list.forEach(function(r){set[r.date.slice(0,7)]=1});
  return Object.keys(set).sort().reverse();
}
function csvField(v){
  var s=String(v);
  if(/^[=+\-@\t\r]/.test(s))s="'"+s;   // 엑셀이 수식으로 읽지 않게
  return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
}
function toCsv(list){
  var rows=list.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:a.id-b.id});
  var lines=["날짜,분류,금액,메모"].concat(rows.map(function(r){return[r.date,r.cat,r.amount,r.memo||""].map(csvField).join(",")}));
  return"﻿"+lines.join("\r\n")+"\r\n";   // BOM: 엑셀에서 한글이 깨지지 않게
}

var GUESS=[
  ["식비",/식당|한정식|정식|카페|커피|치킨|피자|분식|김밥|음식|레스토랑|푸드|버거|국밥|주점|베이커리|빵집|반점/g],
  ["장보기",/마트|편의점|슈퍼|GS25|세븐일레븐|시장/g],
  ["교통",/주유소?|휘발유|경유|택시|버스|지하철|주차|톨게이트|하이패스|코레일|KTX/g],
  ["아이",/학원|문구|장난감|어린이|유치원|키즈/g],
  ["생활",/약국|병원|세탁|미용|헤어|통신|다이소/g]
];
// 영수증 글자에서 가게 이름, 합계, 날짜, 분류를 짐작합니다. 짐작은 항상 사람이 확인합니다.
function parseReceipt(text,catList){
  var lines=text.split(/\r?\n/).map(function(l){return l.replace(/(\d)\s*,\s*(\d)/g,"$1,$2").trim()}).filter(Boolean);
  var nums=function(l){return(l.match(/\d{1,3}(?:,\d{3})+|\d{4,}/g)||[]).map(function(s){return Number(s.replace(/,/g,""))})};
  var KEYW=/합계|총액|결제금액|받을금액|청구금액|총결제|결제요청|TOTAL/i,total=0,sure=false;
  for(var i=0;i<lines.length;i++){
    if(!KEYW.test(lines[i].replace(/\s+/g,"")))continue;
    var c=nums(lines[i]).concat(nums(lines[i+1]||"")).filter(function(v){return v>=100});
    if(c.length){total=Math.max(total,c[0]);sure=true}
  }
  if(!total){
    var all=[].concat.apply([],lines.map(nums)).filter(function(v){return v>=100&&v<10000000});
    if(all.length)total=Math.max.apply(null,all);
  }
  var store=(lines.filter(function(l){return /[가-힣A-Za-z]{2,}/.test(l)&&!/^\d/.test(l)&&!/영수증|신용|카드|승인|매출|전표/.test(l)})[0]||"")
    .replace(/[^\w가-힣\s&().-]/g,"").replace(/\s+/g," ").trim().slice(0,20);
  var date="",dm=text.match(/(20\d{2})\s*[-./년]\s*(\d{1,2})\s*[-./월]\s*(\d{1,2})/);
  if(dm&&+dm[2]>=1&&+dm[2]<=12&&+dm[3]>=1&&+dm[3]<=31)date=dm[1]+"-"+pad(+dm[2])+"-"+pad(+dm[3]);
  var flat=text.replace(/\s+/g,""),best="",bestN=0;
  GUESS.forEach(function(g){
    if(catList.indexOf(g[0])<0)return;
    var n=(flat.match(g[1])||[]).length;if(n>bestN){bestN=n;best=g[0]}
  });
  return{store:store,total:total,sure:sure,date:date,cat:best};
}

/* ---------- 화면 ---------- */
function say(t,ok){var e=$("msg");e.textContent=t;e.className="msg "+(ok?"ok":"err")}
function catsHtml(){
  $("cats").innerHTML=cats.map(function(c){return '<button type="button" aria-pressed="'+(c===cat)+'" data-c="'+esc(c)+'">'+esc(c)+'</button>'}).join("");
  $("chips").innerHTML=cats.map(function(c){return '<span class="chip">'+esc(c)+'<button type="button" data-del="'+esc(c)+'" aria-label="'+esc(c)+' 분류 삭제">✕</button></span>'}).join("");
}
function render(){
  var cur=todayStr().slice(0,7),months=monthsOf(records,cur);
  if(months.indexOf(viewYm)<0)viewYm=cur;
  $("month").innerHTML=months.map(function(m){return '<option value="'+m+'"'+(m===viewYm?" selected":"")+'>'+ymLabel(m)+(m===cur?" (이번 달)":"")+'</option>'}).join("");
  var label=viewYm===cur?"이번 달":ymLabel(viewYm);
  $("sumtitle").textContent=label+" 쓴 돈";
  $("listtitle").textContent=label+" 기록";
  var s=summarize(records,viewYm,cats);
  $("total").textContent=won(s.total);
  var max=Math.max.apply(null,s.rows.map(function(r){return r.value}).concat([0]));
  $("bars").innerHTML=s.rows.map(function(r){
    var w=max?Math.round(r.value/max*100):0,p=s.total?Math.round(r.value/s.total*100):0;
    return '<div class="bar'+(r.gone?" gone":"")+'"><div class="top"><span>'+esc(r.name)+(r.gone?' <span class="gonetag">(삭제한 분류)</span>':"")+' <span class="pct">'+p+'%</span></span><b>'+won(r.value)+'</b></div><div class="track"><div class="fill" style="width:'+w+'%"></div></div></div>';
  }).join("");
  var mine=records.filter(function(r){return r.date.slice(0,7)===viewYm}).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:b.id-a.id});
  $("list").innerHTML=mine.length?mine.map(function(r){
    return '<div class="rec"><div class="info"><div class="d">'+(+r.date.slice(5,7))+"월 "+(+r.date.slice(8))+'일</div><div><span class="c">'+esc(r.cat)+'</span><span class="m">'+esc(r.memo||"")+'</span></div></div><div class="a">'+won(r.amount)+'</div><button data-id="'+r.id+'" aria-label="기록 삭제">✕</button></div>';
  }).join(""):'<p class="empty">이 달 기록이 아직 없습니다.</p>';
  catsHtml();
}

/* ---------- 이벤트 ---------- */
$("month").addEventListener("change",function(e){viewYm=e.target.value;render()});
$("cats").addEventListener("click",function(e){var b=e.target.closest("button[data-c]");if(!b)return;cat=b.dataset.c;catsHtml()});
$("manageBtn").addEventListener("click",function(){
  var open=$("manage").hidden;$("manage").hidden=!open;$("manageBtn").setAttribute("aria-expanded",open);
});
function catSay(t,ok){var e=$("catmsg");e.textContent=t;e.className="msg "+(ok?"ok":"err")}
function addCat(){
  var v=$("newcat").value.trim();
  if(!v)return catSay("분류 이름을 입력해 주세요.");
  if(cats.indexOf(v)>=0)return catSay("이미 있는 분류입니다.");
  if(cats.length>=12)return catSay("분류는 12개까지 만들 수 있습니다.");
  cats.push(v);persist();$("newcat").value="";catSay("'"+v+"' 분류를 추가했습니다.",true);render();
}
$("addcat").addEventListener("click",addCat);
$("newcat").addEventListener("keydown",function(e){if(e.key==="Enter")addCat()});
$("chips").addEventListener("click",function(e){
  var b=e.target.closest("button[data-del]");if(!b)return;
  var name=b.dataset.del;
  if(cats.length<=1)return catSay("분류가 하나는 있어야 합니다.");
  var n=records.filter(function(r){return r.cat===name}).length;
  if(!confirm("'"+name+"' 분류를 지울까요?"+(n?"\n이 분류로 적은 기록 "+n+"건은 지워지지 않고, 그래프에 '삭제한 분류'로 남습니다.":"")))return;
  cats=cats.filter(function(c){return c!==name});if(cat===name)cat="";
  persist();catSay("'"+name+"' 분류를 삭제했습니다.",true);render();
});
$("amt").addEventListener("input",function(e){
  var d=e.target.value.replace(/\D/g,"").slice(0,9);
  e.target.value=d?Number(d).toLocaleString("ko-KR"):"";
});
$("save").addEventListener("click",function(){
  var date=$("date").value,amount=Number($("amt").value.replace(/\D/g,""));
  if(!date)return say("날짜를 골라 주세요.");
  if(!cat)return say("분류를 골라 주세요.");
  if(!amount)return say("금액을 입력해 주세요.");
  records.push({id:Date.now(),date:date,cat:cat,amount:amount,memo:$("memo").value.trim()});
  persist();
  $("amt").value="";$("memo").value="";$("rstatus").textContent="";
  viewYm=date.slice(0,7);   // 방금 적은 기록이 있는 달을 바로 보여 줍니다
  say("저장했습니다.",true);render();
});
$("list").addEventListener("click",function(e){
  var b=e.target.closest("button[data-id]");if(!b)return;
  if(!confirm("이 기록을 지울까요?"))return;
  records=records.filter(function(r){return String(r.id)!==b.dataset.id});
  persist();render();
});

/* CSV 내보내기 */
function download(name,text){
  var url=URL.createObjectURL(new Blob([text],{type:"text/csv;charset=utf-8"}));
  var a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url)},1000);
}
$("csvMonth").addEventListener("click",function(){
  var list=records.filter(function(r){return r.date.slice(0,7)===viewYm});
  if(!list.length)return say("이 달에는 내보낼 기록이 없습니다.");
  download("gagyebu-"+viewYm+".csv",toCsv(list));say(ymLabel(viewYm)+" 기록 "+list.length+"건을 내려받았습니다.",true);
});
$("csvAll").addEventListener("click",function(){
  if(!records.length)return say("내보낼 기록이 없습니다.");
  download("gagyebu-전체.csv",toCsv(records));say("전체 기록 "+records.length+"건을 내려받았습니다.",true);
});

/* 영수증 읽기 (브라우저 안에서 처리. 읽을 준비를 내려받을 때만 인터넷이 필요) */
var ocrLib;
function loadOcr(){
  return ocrLib||(ocrLib=new Promise(function(ok,no){
    var s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
    s.onload=function(){ok(window.Tesseract)};s.onerror=function(){ocrLib=null;no(new Error("load"))};
    document.head.appendChild(s);
  }));
}
function shrink(file){
  return new Promise(function(ok,no){
    var img=new Image(),u=URL.createObjectURL(file);
    img.onload=function(){
      var k=Math.min(1,2000/Math.max(img.width,img.height)),c=document.createElement("canvas");
      c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c);
    };
    img.onerror=function(){no(new Error("img"))};img.src=u;
  });
}
function rstat(t,color){var e=$("rstatus");e.textContent=t;e.style.color=color||"var(--sub)"}
$("rfile").addEventListener("change",function(e){
  var f=e.target.files[0];e.target.value="";if(!f)return;
  rstat("영수증 읽는 중... (처음에는 1분쯤 걸릴 수 있습니다)");
  Promise.all([loadOcr(),shrink(f)]).then(function(r){
    return r[0].createWorker("kor+eng",1,{logger:function(m){if(m.status==="recognizing text")rstat("영수증 읽는 중... "+Math.round(m.progress*100)+"%")}}).then(function(w){
      return w.recognize(r[1]).then(function(res){return w.terminate().then(function(){return res.data.text})});
    });
  }).then(function(text){
    var p=parseReceipt(text,cats);
    if(!p.total)return rstat("금액을 찾지 못했습니다. 직접 입력해 주세요.","var(--bad)");
    $("amt").value=p.total.toLocaleString("ko-KR");
    $("memo").value=p.store||"";
    if(p.date)$("date").value=p.date;
    if(p.cat){cat=p.cat;catsHtml()}
    var got=["금액"].concat(p.store?["메모(가게 이름)"]:[],p.date?["날짜"]:[],p.cat?["분류"]:[]).join("·");
    rstat("읽은 내용: "+got+(p.sure?"":" (합계 문구를 못 찾아 가장 큰 숫자를 넣었습니다)")+". 맞는지 확인하고 분류를 고른 뒤 저장해 주세요.","var(--main)");
    $("amt").scrollIntoView({behavior:"smooth",block:"center"});
  }).catch(function(){rstat("영수증을 읽지 못했습니다. 인터넷 연결을 확인하거나 직접 입력해 주세요.","var(--bad)")});
});

load();
$("date").value=todayStr();
$("warn").hidden=canSave;
render();
</script>
</body>
</html>
