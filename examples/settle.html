<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모임 정산 계산기</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#1b1f2a;--sub:#667085;--main:#3563e9;--danger:#d92d20;--line:#e3e7ef;--ok:#12805c}
@media (prefers-color-scheme:dark){:root{--bg:#12141a;--card:#1c1f28;--text:#eef0f6;--sub:#9aa3b5;--main:#6b8cff;--danger:#ff6b60;--line:#2c3040;--ok:#3ddc97}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:18px/1.5 -apple-system,"Malgun Gothic",sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:8px 0 16px}
section{background:var(--card);border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
h2{font-size:20px;margin:0 0 12px}
h3{font-size:17px;margin:14px 0 6px;color:var(--sub)}
input,select{width:100%;height:56px;font-size:18px;padding:0 14px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);margin-bottom:10px}
input:focus,select:focus{outline:none;border-color:var(--main)}
button,.btn{display:flex;align-items:center;justify-content:center;height:56px;font-size:18px;font-weight:700;border:0;border-radius:12px;background:var(--main);color:#fff;padding:0 18px;cursor:pointer;font-family:inherit}
button.ghost,.btn.ghost{background:transparent;color:var(--main);border:2px solid var(--main);width:100%}
button.gray{background:transparent;color:var(--sub);border:2px solid var(--line);width:100%}
button.x{height:44px;width:44px;padding:0;background:transparent;color:var(--danger);font-size:22px}
.row{display:flex;gap:10px}.row input{margin-bottom:0}
.add{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:flex;align-items:center;background:var(--bg);border-radius:999px;padding:2px 2px 2px 16px;font-weight:600}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.pick button{height:48px;padding:0 16px;background:transparent;color:var(--sub);border:2px solid var(--line);border-radius:999px;font-weight:600}
.pick button[aria-pressed=true]{background:var(--main);border-color:var(--main);color:#fff}
.pick button.all{border-style:dashed}
.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.item small{color:var(--sub);display:block;font-size:15px}
.amt{font-weight:700;white-space:nowrap;display:flex;align-items:center}
.sum{display:flex;justify-content:space-between;font-size:20px;padding:6px 0}
.sum b{font-size:24px}
.per{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line)}
.tx{background:var(--bg);border-radius:12px;padding:14px;margin-top:10px;font-size:20px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tx b{color:var(--main)}
.hint{color:var(--sub);font-size:16px;margin:8px 0 0}
.err{color:var(--danger);font-size:16px;margin:6px 0 0}
.status{font-size:16px;margin:8px 0 0;color:var(--ok)}
.status.busy{color:var(--sub)}
.stack>*+*{margin-top:10px}
</style>
</head>
<body>
<main>
<h1>🧾 모임 정산 계산기</h1>

<section>
  <h2>① 총무 계좌번호</h2>
  <input id="acct" placeholder="예: 국민 123-456-789 홍길동" autocomplete="off" style="margin-bottom:0">
  <p class="hint">정산 문장에 들어갑니다. 비워 두면 문장의 계좌 칸이 빈 채로 복사됩니다.</p>
</section>

<section>
  <h2>② 참석자</h2>
  <div class="row">
    <input id="pname" placeholder="이름 입력" enterkeyhint="done" autocomplete="off">
    <button id="padd" style="flex:none">추가</button>
  </div>
  <div class="err" id="perr"></div>
  <div class="chips" id="chips"></div>
  <h3>총무 <span style="font-weight:400">(전부 결제한 사람)</span></h3>
  <select id="tsel" style="margin-bottom:0"></select>
</section>

<section>
  <h2>③ 지출 항목</h2>
  <label class="btn ghost" for="rfile">📷 영수증 사진으로 입력</label>
  <input id="rfile" type="file" accept="image/*" hidden>
  <div class="status busy" id="rstatus"></div>

  <h3>항목</h3>
  <input id="iname" placeholder="항목 (예: 1차 고깃집)" autocomplete="off">
  <input id="iamt" placeholder="금액 (원)" inputmode="numeric" autocomplete="off">
  <h3>함께 나눌 사람 <span style="font-weight:400">(마신 사람만 골라 주세요)</span></h3>
  <div class="pick" id="ipick"></div>
  <button class="add" id="iadd">+ 항목 추가</button>
  <div class="err" id="ierr"></div>
  <div id="items" style="margin-top:12px"></div>
</section>

<section>
  <h2>④ 정산 결과</h2>
  <div class="sum"><span>총액</span><b id="total">0원</b></div>
  <p class="hint" id="remnote"></p>
  <h3>인원별 부담액</h3>
  <div id="pers"></div>
  <h3 id="txhead">보내야 할 돈</h3>
  <div id="txs"></div>
  <div class="stack" style="margin-top:16px">
    <button class="add" id="copy">📋 단톡방용 문장 복사</button>
    <div class="status" id="cstatus"></div>
    <button class="gray" id="reset">처음부터 다시 하기</button>
  </div>
</section>
</main>

<script>
const KEY='settle-v2';
// item: {name, amount, members:null(전원)|[이름...]}. 모든 지출은 총무가 결제한 것으로 계산
let state={people:[],items:[],treasurer:'',account:''};
try{const s=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('settle-v1'));if(s&&s.people&&s.items)state=s}catch(e){}
if(!state.people.includes(state.treasurer))state.treasurer=state.people[0]||'';
let sel=new Set(state.people);   // 입력 폼에서 선택된 '함께 나눌 사람'
const $=id=>document.getElementById(id);
const won=n=>n.toLocaleString('ko-KR')+'원';
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 계산 ---------- */
// bals: [{name, bal}] bal>0 받을 사람, bal<0 보낼 사람. 송금 횟수 최소화.
function minTransfers(bals){
  const p=bals.filter(b=>b.bal!==0);
  const n=p.length;
  if(!n)return [];
  let groups;
  if(n<=16){
    const N=1<<n,sum=new Int32Array(N),dp=new Int16Array(N),pick=new Int8Array(N);
    for(let m=1;m<N;m++){const low=31-Math.clz32(m&-m);sum[m]=sum[m&(m-1)]+p[low].bal}
    for(let m=1;m<N;m++){
      let best=-1,bi=0;
      for(let i=0;i<n;i++)if(m>>i&1){const v=dp[m^(1<<i)];if(v>best){best=v;bi=i}}
      dp[m]=best+(sum[m]===0?1:0);pick[m]=bi;
    }
    const order=[];let m=N-1;
    while(m){order.push(pick[m]);m^=1<<pick[m]}
    order.reverse();
    groups=[];let cur=[],s=0;
    for(const i of order){cur.push(p[i]);s+=p[i].bal;if(s===0){groups.push(cur);cur=[]}}
    if(cur.length)groups.push(cur);
  }else groups=[p];
  const out=[];
  for(const g of groups){
    const cr=g.filter(x=>x.bal>0).map(x=>({n:x.name,v:x.bal})).sort((a,b)=>b.v-a.v);
    const db=g.filter(x=>x.bal<0).map(x=>({n:x.name,v:-x.bal})).sort((a,b)=>b.v-a.v);
    let i=0,j=0;
    while(i<db.length&&j<cr.length){
      const a=Math.min(db[i].v,cr[j].v);
      out.push({from:db[i].n,to:cr[j].n,amount:a});
      db[i].v-=a;cr[j].v-=a;
      if(!db[i].v)i++;if(!cr[j].v)j++;
    }
  }
  return out;
}
const membersOf=(it,people)=>it.members?people.filter(p=>it.members.includes(p)):people;
function compute(people,items,treasurer){
  const total=items.reduce((s,x)=>s+x.amount,0);
  const owed={},paid={};
  people.forEach(p=>{owed[p]=0;paid[p]=0});
  let rem=0;
  for(const it of items){
    const m=membersOf(it,people);
    if(!m.length)continue;
    const sh=Math.floor(it.amount/m.length),r=it.amount-sh*m.length;
    m.forEach((p,i)=>owed[p]+=sh+(i===0?r:0));
    rem+=r;
    if(paid[treasurer]!==undefined)paid[treasurer]+=it.amount;
  }
  const bals=people.map(name=>({name,bal:paid[name]-owed[name]}));
  return{total,owed,rem,tx:minTransfers(bals)};
}

/* ---------- 영수증 파싱 (순수 함수) ---------- */
function parseReceipt(text){
  const lines=text.split(/\r?\n/).map(l=>l.replace(/(\d)\s*,\s*(\d)/g,'$1,$2').trim()).filter(Boolean);
  const nums=l=>(l.match(/\d{1,3}(?:,\d{3})+|\d{4,}/g)||[]).map(s=>Number(s.replace(/,/g,'')));
  const KEY=/합계|총액|결제금액|받을금액|청구금액|총결제|결제요청|TOTAL/i;
  let total=0,sure=false;
  for(let i=0;i<lines.length;i++){
    if(!KEY.test(lines[i].replace(/\s+/g,'')))continue;
    const c=nums(lines[i]).concat(nums(lines[i+1]||'')).filter(v=>v>=100);
    if(c.length){total=Math.max(total,c[0]);sure=true}
  }
  if(!total){
    const all=lines.flatMap(nums).filter(v=>v>=100&&v<10000000);
    if(all.length)total=Math.max(...all);
  }
  const store=lines.find(l=>/[가-힣A-Za-z]{2,}/.test(l)&&!/^\d/.test(l)&&!/영수증|신용|카드|승인|매출|전표/.test(l))||'';
  return{store:store.replace(/[^\w가-힣\s&().-]/g,'').replace(/\s+/g,' ').trim().slice(0,20),total,sure};
}

/* ---------- 복사 문장 ---------- */
function summaryText(people,items,r,treasurer,account){
  const L=['🧾 정산 결과',`총액 ${won(r.total)} (${people.length}명, 총무 ${treasurer})`,''];
  if(items.length){
    L.push('[지출 내역]');
    items.forEach(it=>{
      const m=membersOf(it,people);
      L.push(`- ${it.name} ${won(it.amount)} (${it.members?`${m.join('·')} ${m.length}명`:'전원'})`);
    });
    L.push('');
  }
  L.push(`총무 계좌: ${account||''}`);
  L.push('');
  if(r.tx.length){
    L.push(`💸 송금 안내 (총 ${r.tx.length}번)`);
    r.tx.forEach(t=>L.push(`${t.from} → ${t.to} ${won(t.amount)}`));
  }else L.push('송금할 내역이 없습니다 🎉');
  return L.join('\n');
}

/* ---------- 화면 ---------- */
function render(){
  const ps=state.people;
  sel=new Set([...sel].filter(p=>ps.includes(p)));
  $('chips').innerHTML=ps.map((p,i)=>`<span class="chip">${esc(p)}<button class="x" data-p="${i}" aria-label="${esc(p)} 삭제">✕</button></span>`).join('');
  $('tsel').innerHTML=ps.length?ps.map(p=>`<option${p===state.treasurer?' selected':''}>${esc(p)}</option>`).join(''):'<option value="">먼저 참석자를 추가하세요</option>';
  $('ipick').innerHTML=ps.length?`<button class="all" data-all="1" aria-pressed="${sel.size===ps.length}">전체</button>`+
    ps.map((p,i)=>`<button data-m="${i}" aria-pressed="${sel.has(p)}">${esc(p)}</button>`).join(''):'';
  $('items').innerHTML=state.items.map((x,i)=>{
    const m=membersOf(x,ps);
    return `<div class="item"><div>${esc(x.name)}<small>${x.members?m.map(esc).join(', ')+' ('+m.length+'명)':'전원'}</small></div><div class="amt">${won(x.amount)}<button class="x" data-i="${i}" aria-label="삭제">✕</button></div></div>`;
  }).join('');
  const r=compute(ps,state.items,state.treasurer);
  $('total').textContent=won(r.total);
  $('remnote').textContent=r.rem?'나누어떨어지지 않는 1원 단위는 항목별 첫 번째 참여자가 부담합니다.':'';
  $('pers').innerHTML=ps.length?ps.map(p=>`<div class="per"><span>${esc(p)}</span><b>${won(r.owed[p])}</b></div>`).join(''):'<p class="hint">참석자를 추가해 주세요.</p>';
  $('txhead').textContent=r.tx.length?`보내야 할 돈 (총 ${r.tx.length}번)`:'보내야 할 돈';
  $('txs').innerHTML=!ps.length?'':
    r.tx.length?r.tx.map(t=>`<div class="tx"><span>${esc(t.from)} → ${esc(t.to)}</span><b>${won(t.amount)}</b></div>`).join(''):
    `<p class="hint">${r.total?'송금할 돈이 없습니다. 모두 끝났어요! 🎉':'지출 항목을 추가하면 결과가 나옵니다.'}</p>`;
  save();
}
function addPerson(){
  const v=$('pname').value.trim();
  if(!v)return;
  if(state.people.includes(v)){$('perr').textContent='이미 있는 이름입니다.';return}
  $('perr').textContent='';state.people.push(v);sel.add(v);if(!state.treasurer)state.treasurer=v;$('pname').value='';render();$('pname').focus();
}
$('padd').onclick=addPerson;
$('pname').onkeydown=e=>{if(e.key==='Enter')addPerson()};
$('chips').onclick=e=>{
  const b=e.target.closest('[data-p]');if(!b)return;
  const name=state.people[b.dataset.p];
  const solo=state.items.filter(x=>x.members&&x.members.length===1&&x.members[0]===name);
  if(solo.length&&!confirm(`${name}님 혼자 나눈 항목이 함께 삭제됩니다. 계속할까요?`))return;
  state.items=state.items.filter(x=>!solo.includes(x));
  state.items.forEach(x=>{if(x.members)x.members=x.members.filter(p=>p!==name)});
  state.people.splice(b.dataset.p,1);
  if(state.treasurer===name)state.treasurer=state.people[0]||'';
  render();
};
$('tsel').onchange=e=>{state.treasurer=e.target.value;render()};
$('ipick').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.all)sel=sel.size===state.people.length?new Set():new Set(state.people);
  else{const p=state.people[b.dataset.m];sel.has(p)?sel.delete(p):sel.add(p)}
  render();
};
$('iamt').oninput=e=>{const d=e.target.value.replace(/\D/g,'');e.target.value=d?Number(d).toLocaleString('ko-KR'):''};
$('iadd').onclick=()=>{
  const name=$('iname').value.trim(),amount=Number($('iamt').value.replace(/\D/g,''));
  if(!state.treasurer){$('ierr').textContent='참석자를 먼저 추가해 주세요.';return}
  if(!amount){$('ierr').textContent='금액을 입력해 주세요.';return}
  if(!sel.size){$('ierr').textContent='함께 나눌 사람을 한 명 이상 골라 주세요.';return}
  $('ierr').textContent='';$('rstatus').textContent='';
  const all=sel.size===state.people.length;
  state.items.push({name:name||'항목 '+(state.items.length+1),amount,members:all?null:state.people.filter(p=>sel.has(p))});
  $('iname').value='';$('iamt').value='';sel=new Set(state.people);render();
};
$('items').onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;state.items.splice(b.dataset.i,1);render()};
$('reset').onclick=()=>{if(confirm('입력한 내용을 모두 지울까요?')){state={people:[],items:[],treasurer:'',account:''};sel=new Set();$('acct').value='';render()}};

/* 복사 */
$('copy').onclick=async()=>{
  const r=compute(state.people,state.items,state.treasurer);
  if(!state.people.length||!state.items.length){$('cstatus').textContent='참석자와 지출 항목을 먼저 입력해 주세요.';$('cstatus').style.color='var(--danger)';return}
  const text=summaryText(state.people,state.items,r,state.treasurer,state.account);
  let ok=false;
  try{await navigator.clipboard.writeText(text);ok=true}catch(e){
    const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';
    document.body.appendChild(t);t.select();try{ok=document.execCommand('copy')}catch(_){}t.remove();
  }
  $('cstatus').style.color=ok?'var(--ok)':'var(--danger)';
  $('cstatus').textContent=ok?'복사했습니다. 단톡방에 붙여 넣으세요.':'복사에 실패했습니다. 브라우저 권한을 확인해 주세요.';
};

/* 영수증 OCR (브라우저 안에서 처리, 사진은 외부로 전송되지 않음. 처음 한 번만 인식 데이터를 내려받음) */
let ocrLib;
const loadOcr=()=>ocrLib||(ocrLib=new Promise((ok,no)=>{
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
  s.onload=()=>ok(window.Tesseract);s.onerror=()=>{ocrLib=null;no(new Error('load'))};
  document.head.appendChild(s);
}));
function shrink(file){
  return new Promise((ok,no)=>{
    const img=new Image(),u=URL.createObjectURL(file);
    img.onload=()=>{
      const k=Math.min(1,2000/Math.max(img.width,img.height));
      const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c);
    };
    img.onerror=()=>no(new Error('img'));img.src=u;
  });
}
$('rfile').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const st=$('rstatus');st.className='status busy';
  try{
    st.textContent='영수증 읽는 중... (처음에는 인식 데이터를 내려받느라 1분 정도 걸릴 수 있습니다)';
    const [T,canvas]=await Promise.all([loadOcr(),shrink(f)]);
    const w=await T.createWorker('kor+eng',1,{logger:m=>{if(m.status==='recognizing text')st.textContent=`영수증 읽는 중... ${Math.round(m.progress*100)}%`}});
    const {data}=await w.recognize(canvas);await w.terminate();
    const r=parseReceipt(data.text);
    if(!r.total){st.className='status';st.style.color='var(--danger)';st.textContent='금액을 찾지 못했습니다. 직접 입력해 주세요.';return}
    $('iname').value=r.store||'';
    $('iamt').value=r.total.toLocaleString('ko-KR');
    st.style.color='';st.className='status';
    st.textContent=(r.sure?'인식했습니다.':'합계 문구를 찾지 못해 가장 큰 숫자를 가져왔습니다.')+' 금액을 확인하고, 함께 나눌 사람을 고른 뒤 추가해 주세요.';
    $('iamt').scrollIntoView({behavior:'smooth',block:'center'});
  }catch(err){
    st.className='status';st.style.color='var(--danger)';
    st.textContent='영수증을 읽지 못했습니다. 인터넷 연결을 확인하거나 직접 입력해 주세요.';
  }
};
$('acct').value=state.account||'';
$('acct').oninput=e=>{state.account=e.target.value.trim();save()};
render();
</script>
</body>
</html>
